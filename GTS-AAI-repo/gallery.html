<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APCL 2026 – Gallery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background: #0b0f1e; }
    .gold { color: #facc15; }
    .hero-bg {
      background-image: url('/apcl-logo.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      position: relative; overflow: hidden;
      min-height: 40vh;
    }
    .hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(6,13,46,0.6) 0%, rgba(6,13,46,0.92) 100%);
    }
    .drop-zone {
      border: 2px dashed rgba(250,204,21,0.4);
      border-radius: 1rem;
      transition: all 0.2s;
      cursor: pointer;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: #facc15;
      background: rgba(250,204,21,0.05);
    }
    .media-thumb { aspect-ratio: 1; object-fit: cover; width: 100%; border-radius: 0.75rem; display: block; }
    .lightbox {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.92);
      display: flex; align-items: center; justify-content: center;
      padding: 1rem;
    }
    .lightbox img, .lightbox video {
      max-width: 92vw; max-height: 88vh;
      border-radius: 0.75rem;
      box-shadow: 0 0 60px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body class="min-h-screen text-white">

  <!-- ── Hero ───────────────────────────────────────────────────────────── -->
  <header class="hero-bg">
    <div class="hero-overlay"></div>
    <div class="max-w-5xl mx-auto px-6 py-10 text-center relative z-10 flex flex-col justify-end" style="min-height:40vh;">
      <div class="mt-auto mb-4">
        <h1 class="text-2xl md:text-3xl font-black text-white tracking-wide">📸 Tournament Gallery</h1>
        <p class="text-xs tracking-[0.3em] font-semibold gold mt-1">APCL 2026 · GTS INDIA AAI &amp; Portfolio</p>
      </div>
      <nav class="flex flex-wrap justify-center gap-3 text-sm">
        <a href="/" class="px-4 py-2 rounded-full font-medium border border-white/20 text-white/70 hover:text-white hover:bg-white/10 transition-all">🏠 Home</a>
        <a href="/cricket" class="px-4 py-2 rounded-full font-medium border border-white/20 text-white/70 hover:text-white hover:bg-white/10 transition-all">🏏 Cricket</a>
        <a href="/admin" class="px-4 py-2 rounded-full font-medium border border-white/20 text-white/70 hover:text-white hover:bg-white/10 transition-all">⚙ Admin</a>
      </nav>
    </div>
  </header>

  <div id="root"></div>

  <script type="text/babel">
    function Gallery() {
      const { useState, useEffect, useRef } = React;

      const [media, setMedia]         = useState([]);
      const [loading, setLoading]     = useState(true);
      const [uploading, setUploading] = useState(false);
      const [progress, setProgress]   = useState(0);
      const [error, setError]         = useState('');
      const [successMsg, setSuccess]  = useState('');
      const [selected, setSelected]   = useState(null);
      const [dragOver, setDragOver]   = useState(false);
      const fileRef = useRef(null);

      const fetchMedia = () => {
        fetch('/api/media')
          .then(r => r.json())
          .then(data => { setMedia(data); setLoading(false); })
          .catch(() => { setError('Failed to load media.'); setLoading(false); });
      };

      useEffect(() => { fetchMedia(); }, []);

      const upload = (files) => {
        if (!files || files.length === 0) return;
        setError(''); setSuccess('');
        Array.from(files).forEach(file => {
          const form = new FormData();
          form.append('file', file);
          setUploading(true); setProgress(0);
          const xhr = new XMLHttpRequest();
          xhr.upload.onprogress = e => {
            if (e.lengthComputable) setProgress(Math.round(e.loaded / e.total * 100));
          };
          xhr.onload = () => {
            setUploading(false); setProgress(0);
            if (xhr.status === 201) {
              setSuccess('Uploaded successfully!');
              fetchMedia();
              setTimeout(() => setSuccess(''), 3000);
            } else {
              try { setError(JSON.parse(xhr.responseText).error || 'Upload failed'); }
              catch { setError('Upload failed'); }
            }
          };
          xhr.onerror = () => { setUploading(false); setError('Upload failed — check server.'); };
          xhr.open('POST', '/api/upload');
          xhr.send(form);
        });
      };

      const handleDelete = (item) => {
        if (!window.confirm(`Delete "${item.name}"?`)) return;
        fetch(`/api/media/${encodeURIComponent(item.name)}`, { method: 'DELETE' })
          .then(r => r.json())
          .then(() => { fetchMedia(); if (selected?.name === item.name) setSelected(null); })
          .catch(() => setError('Delete failed.'));
      };

      const formatSize = (bytes) => {
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
      };

      return (
        <>
        <main className="max-w-5xl mx-auto px-6 py-8 space-y-6">

          {/* Alerts */}
          {error && (
            <div className="bg-red-900/40 border border-red-500/50 text-red-300 rounded-xl px-4 py-3 flex justify-between text-sm">
              <span>✗ {error}</span>
              <button onClick={() => setError('')} className="font-bold ml-4">✕</button>
            </div>
          )}
          {successMsg && (
            <div className="bg-green-900/40 border border-green-500/50 text-green-300 rounded-xl px-4 py-3 text-sm">
              ✓ {successMsg}
            </div>
          )}

          {/* Upload zone */}
          <div
            className={`drop-zone p-8 text-center ${dragOver ? 'drag-over' : ''}`}
            onDragOver={e => { e.preventDefault(); setDragOver(true); }}
            onDragLeave={() => setDragOver(false)}
            onDrop={e => { e.preventDefault(); setDragOver(false); upload(e.dataTransfer.files); }}
            onClick={() => !uploading && fileRef.current.click()}
          >
            <input ref={fileRef} type="file" accept="image/*,video/*" multiple
                   style={{display:'none'}} onChange={e => upload(e.target.files)} />

            {uploading ? (
              <div className="space-y-3">
                <p className="text-yellow-400 font-semibold text-sm">Uploading… {progress}%</p>
                <div className="w-full bg-gray-700 rounded-full h-2 max-w-xs mx-auto">
                  <div className="bg-yellow-400 h-2 rounded-full transition-all duration-200"
                       style={{width: progress + '%'}}></div>
                </div>
              </div>
            ) : (
              <div className="space-y-2">
                <p className="text-4xl">📤</p>
                <p className="text-white font-semibold">Drop photos or videos here</p>
                <p className="text-gray-500 text-xs">or click to browse &nbsp;·&nbsp; JPG, PNG, GIF, WebP, MP4, WebM, MOV</p>
              </div>
            )}
          </div>

          {/* Media count */}
          {!loading && (
            <div className="flex items-center justify-between text-xs text-gray-500">
              <span>{media.length} item{media.length !== 1 ? 's' : ''} &nbsp;·&nbsp;
                {media.filter(m => m.type === 'image').length} photos &nbsp;·&nbsp;
                {media.filter(m => m.type === 'video').length} videos
              </span>
            </div>
          )}

          {/* Grid */}
          {loading ? (
            <div className="text-center py-20 text-gray-500">Loading…</div>
          ) : media.length === 0 ? (
            <div className="text-center py-20 text-gray-600">
              <p className="text-5xl mb-3">🖼</p>
              <p>No photos or videos yet. Upload some above!</p>
            </div>
          ) : (
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
              {media.map((item, i) => (
                <div key={i} className="group relative rounded-xl overflow-hidden bg-gray-800 cursor-pointer"
                     style={{aspectRatio:'1'}}>
                  {item.type === 'image' ? (
                    <img src={item.url} alt={item.name} className="media-thumb"
                         onClick={() => setSelected(item)} />
                  ) : (
                    <div className="relative w-full h-full" onClick={() => setSelected(item)}>
                      <video src={item.url} className="media-thumb" muted playsInline />
                      <div className="absolute inset-0 flex items-center justify-center">
                        <span className="text-4xl drop-shadow-lg">▶</span>
                      </div>
                    </div>
                  )}
                  {/* Hover overlay */}
                  <div className="absolute inset-0 bg-black/0 group-hover:bg-black/40 transition-all flex flex-col justify-end opacity-0 group-hover:opacity-100">
                    <div className="p-2 space-y-1">
                      <p className="text-white text-xs font-medium truncate">{item.name}</p>
                      <div className="flex gap-1">
                        <button onClick={(e) => { e.stopPropagation(); setSelected(item); }}
                          className="flex-1 bg-white/20 hover:bg-white/30 text-white text-xs py-1 rounded transition-colors">
                          View
                        </button>
                        <button onClick={(e) => { e.stopPropagation(); handleDelete(item); }}
                          className="flex-1 bg-red-600/70 hover:bg-red-600 text-white text-xs py-1 rounded transition-colors">
                          Delete
                        </button>
                      </div>
                    </div>
                  </div>
                  {/* Video badge */}
                  {item.type === 'video' && (
                    <span className="absolute top-2 right-2 bg-black/60 text-white text-xs px-1.5 py-0.5 rounded">
                      VIDEO
                    </span>
                  )}
                </div>
              ))}
            </div>
          )}

        </main>

        {/* Lightbox */}
        {selected && ReactDOM.createPortal(
          <div className="lightbox" onClick={() => setSelected(null)}>
            <button onClick={() => setSelected(null)}
              className="absolute top-4 right-4 text-white/70 hover:text-white text-3xl font-light z-10">✕</button>
            <div onClick={e => e.stopPropagation()}>
              {selected.type === 'image' ? (
                <img src={selected.url} alt={selected.name} />
              ) : (
                <video src={selected.url} controls autoPlay
                  style={{maxWidth:'92vw', maxHeight:'88vh', borderRadius:'0.75rem'}} />
              )}
              <p className="text-gray-400 text-xs text-center mt-2">{selected.name}</p>
            </div>
          </div>,
          document.body
        )}
      </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Gallery />);
  </script>

  <footer class="text-center py-6 text-gray-700 text-xs border-t border-gray-800 mt-4">
    <span class="gold font-semibold">APCL 2026</span> · GTS INDIA AAI &amp; Portfolio ·
    <a href="/cricket" class="hover:text-gray-400 ml-2">← Back to Cricket</a>
  </footer>

</body>
</html>
