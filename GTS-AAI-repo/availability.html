<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cricket Tournament — Player Availability</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    function AvailabilityForm() {
      const { useState, useEffect } = React;
      const [name, setName]               = useState('');
      const [role, setRole]               = useState('');
      const [availability, setAvailability] = useState('');
      const [existing, setExisting]       = useState([]);
      const [error, setError]             = useState('');
      const [successMsg, setSuccessMsg]   = useState('');
      const [loading, setLoading]         = useState(false);

      // Load existing responses for duplicate-name prevention
      useEffect(() => {
        fetch('/api/availability')
          .then(r => r.json())
          .then(data => setExisting(data))
          .catch(() => {});
      }, []);

      const handleSubmit = (e) => {
        e.preventDefault();
        setError('');
        setSuccessMsg('');

        if (existing.some(e => e.name.trim().toLowerCase() === name.trim().toLowerCase())) {
          setError(`"${name}" has already submitted a response.`);
          return;
        }

        const entry = {
          name: name.trim(),
          role,
          availability,
          time: new Date().toLocaleString()
        };

        setLoading(true);
        fetch('/api/availability', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(entry)
        })
          .then(r => {
            if (!r.ok) return r.json().then(d => { throw new Error(d.error || 'Server error'); });
            return r.json();
          })
          .then(() => {
            setExisting(prev => [...prev, entry]);
            setName('');
            setRole('');
            setAvailability('');
            setSuccessMsg(`Thank you, ${entry.name}! Your response has been recorded.`);
          })
          .catch(err => setError(err.message || 'Failed to save. Please check the server connection.'))
          .finally(() => setLoading(false));
      };

      return (
        <div className="min-h-screen bg-green-50 p-6 flex items-center justify-center">
          <div className="w-full max-w-xl bg-white shadow-xl rounded-3xl p-8">
            <h1 className="text-3xl font-bold text-green-700 mb-2 text-center">
              GTS INDIA AAI &amp; PORTFOLIO Cricket Tournament
            </h1>
            <p className="text-gray-600 text-center mb-6">
              Please confirm your availability for the upcoming tournament.
            </p>

            {error && (
              <div className="mb-4 bg-red-50 border border-red-400 text-red-700 rounded-xl px-4 py-3 flex items-start gap-2">
                <span className="font-bold">✗</span>
                <span>{error}</span>
              </div>
            )}
            {successMsg && (
              <div className="mb-4 bg-green-50 border border-green-400 text-green-700 rounded-xl px-4 py-3 flex items-start gap-2">
                <span className="font-bold">✓</span>
                <span>{successMsg}</span>
              </div>
            )}

            <form className="space-y-4" onSubmit={handleSubmit}>
              <div>
                <label className="block text-sm font-medium mb-1">Name</label>
                <input
                  type="text"
                  required
                  className="w-full border rounded-xl p-3"
                  placeholder="Enter your name"
                  value={name}
                  onChange={e => { setName(e.target.value); setError(''); setSuccessMsg(''); }}
                />
              </div>

              <div>
                <label className="block text-sm font-medium mb-1">Interested In</label>
                <select
                  required
                  className="w-full border rounded-xl p-3"
                  value={role}
                  onChange={e => setRole(e.target.value)}
                >
                  <option value="" disabled>Select your role</option>
                  <option value="Batting">Batting</option>
                  <option value="Bowling">Bowling</option>
                  <option value="All Rounder">All Rounder</option>
                </select>
              </div>

              <div>
                <label className="block text-sm font-medium mb-3">
                  Availability on 11th and 12th August 2026, Time (1:30 PM – 2:30 PM)
                </label>
                <div className="space-y-2">
                  {['Available', 'Not Available'].map(opt => (
                    <label key={opt} className="flex items-center gap-2 cursor-pointer">
                      <input
                        type="radio"
                        name="availability"
                        value={opt}
                        required
                        checked={availability === opt}
                        onChange={() => setAvailability(opt)}
                      />
                      <span>{opt}</span>
                    </label>
                  ))}
                </div>
              </div>

              <button
                type="submit"
                disabled={loading}
                className="w-full bg-green-600 hover:bg-green-700 disabled:bg-green-300 text-white py-3 rounded-xl font-semibold transition-colors"
              >
                {loading ? 'Submitting…' : 'Submit'}
              </button>
            </form>

            <div className="mt-8 p-4 bg-yellow-50 border border-yellow-200 rounded-xl">
              <h3 className="font-semibold text-gray-800 mb-2">Note:</h3>
              <ol className="list-decimal pl-5 text-gray-700 space-y-1 text-sm">
                <li>Based on availability, the team will be formed by random shuffling.</li>
                <li>The match rules will be announced when the team is ready.</li>
              </ol>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AvailabilityForm />);
  </script>
</body>
</html>
