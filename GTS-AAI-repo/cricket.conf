# ─────────────────────────────────────────────────────────────────────────────
# nginx config for Cricket Registration App
# Accessible from ANY machine on the network via http://<server-ip>/
#
# Place this file at:  /etc/nginx/conf.d/cricket.conf
# After editing run:   sudo nginx -t && sudo systemctl reload nginx
#
# FIREWALL (run once on the SUSE server):
#   sudo firewall-cmd --permanent --add-service=http
#   sudo firewall-cmd --reload
#
# Verify with:  curl http://<server-ip>/
#               curl -u adminuser:password http://<server-ip>/admin
#
# CREATE ADMIN PASSWORD (run once on the server):
#   sudo sh -c "echo -n 'adminuser:' >> /etc/nginx/.htpasswd"
#   sudo sh -c "openssl passwd -apr1 >> /etc/nginx/.htpasswd"
#   (you will be prompted to type the password)
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen       0.0.0.0:80 default_server;
    listen       [::]:80 default_server;
    server_name  _;
    index        home.html;         # serve landing page, not index.html

    # ── Serve the static HTML ─────────────────────────────────────────────
    root  /srv/cricket;         # <-- set to the folder containing index.html & admin.html
    index index.html;

    # ── Landing page (home) ───────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /home.html;
    }

    # ── Cricket registration form ─────────────────────────────────────────
    location = /register {
        try_files /register.html =404;
    }

    # ── Cricket main page ─────────────────────────────────────────────────
    location = /cricket {
        try_files /cricket.html =404;
    }

    # ── Carrom main page ──────────────────────────────────────────────────
    location = /carrom {
        try_files /carrom.html =404;
    }

    # ── Admin dashboard (open) ──────────────────────────────────────────────
    location = /admin {
        try_files /admin.html =404;
    }

    # ── Player availability form ─────────────────────────────────────────
    location = /availability {
        try_files /availability.html =404;
    }
    # ── Tournament schedule (public) ──────────────────────────────────────
    location = /schedule {
        try_files /schedule.html =404;
    }

    # ── Photo & video gallery ─────────────────────────────────────────────
    location = /gallery {
        try_files /gallery.html =404;
    }

    # ── Uploaded media files (served directly by nginx) ───────────────────
    location /uploads/ {
        alias /srv/cricket/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }
    # Block direct access to the data folder
    location /data/ {
        deny all;
        return 403;
    }

    # ── Proxy /api/* to the Flask backend (internal only, never exposed directly) ─
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;   # Flask binds only to localhost
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;

        # Return proper error JSON when Flask is down
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"error":"Backend unavailable. Please try again."}';
    }

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options        SAMEORIGIN;
}
