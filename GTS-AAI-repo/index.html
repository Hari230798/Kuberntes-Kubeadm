<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cricket Registration Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    function CricketRegistrationForm() {
      const { useState, useEffect } = React;
      const [teamName, setTeamName] = useState('');
      const [captain, setCaptain] = useState('');
      const [players, setPlayers] = useState(
        Array.from({ length: 6 }, () => ({ name: '', gender: '' }))
      );
      const [submissions, setSubmissions] = useState([]);
      const [error, setError] = useState('');
      const [successMsg, setSuccessMsg] = useState('');
      const [loading, setLoading] = useState(false);

      // Load registrations from server on mount
      useEffect(() => {
        fetch('/api/registrations')
          .then(r => r.json())
          .then(data => setSubmissions(data))
          .catch(() => {
            // Fallback: read from localStorage if server unreachable
            const saved = localStorage.getItem('cricketRegistrations');
            if (saved) setSubmissions(JSON.parse(saved));
          });
      }, []);

      const updatePlayer = (index, field, value) => {
        const updated = [...players];
        updated[index] = { ...updated[index], [field]: value };
        setPlayers(updated);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        setError('');
        setSuccessMsg('');

        // --- Validation: gender composition ---
        const males = players.filter(p => p.gender === 'Male').length;
        const females = players.filter(p => p.gender === 'Female').length;
        if (males !== 5 || females !== 1) {
          setError(`Invalid composition: ${males} Male, ${females} Female. Required: exactly 5 Male and 1 Female.`);
          return;
        }

        // --- Validation: duplicate team name ---
        if (submissions.some(s => s.teamName.trim().toLowerCase() === teamName.trim().toLowerCase())) {
          setError(`Team "${teamName}" is already registered.`);
          return;
        }

        const team = {
          teamName: teamName.trim(),
          captain: captain.trim(),
          players: players.map(p => ({ name: p.name.trim(), gender: p.gender })),
          time: new Date().toLocaleString()
        };

        setLoading(true);
        fetch('/api/registrations', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(team)
        })
          .then(r => {
            if (!r.ok) throw new Error('Server error');
            return r.json();
          })
          .then(() => {
            const updated = [...submissions, team];
            setSubmissions(updated);
            localStorage.setItem('cricketRegistrations', JSON.stringify(updated));
            setTeamName('');
            setCaptain('');
            setPlayers(Array.from({ length: 6 }, () => ({ name: '', gender: '' })));
            setSuccessMsg(`Team "${team.teamName}" registered successfully!`);
          })
          .catch(() => setError('Failed to save. Please check the server connection.'))
          .finally(() => setLoading(false));
      };

      const handleDelete = (idx) => {
        if (!window.confirm(`Delete team "${submissions[idx].teamName}"? This cannot be undone.`)) return;
        fetch(`/api/registrations/${idx}`, { method: 'DELETE' })
          .then(r => {
            if (!r.ok) throw new Error('Server error');
            return r.json();
          })
          .then(() => {
            const updated = submissions.filter((_, i) => i !== idx);
            setSubmissions(updated);
            localStorage.setItem('cricketRegistrations', JSON.stringify(updated));
          })
          .catch(() => setError('Failed to delete. Please check the server connection.'));
      };

      return (
        <div className="min-h-screen bg-green-50 p-6">
          <div className="max-w-4xl mx-auto bg-white rounded-3xl shadow-xl p-8">
            <h1 className="text-3xl font-bold text-green-700 mb-2">
              Mini Cricket Tournament Registration
            </h1>
            <p className="text-gray-600 mb-6">
              Tournament Format: 4 Teams • 6 Players per Team (5 Men + 1 Girl) • 6 Overs • League Matches followed by Final.
            </p>

            {error && (
              <div className="mb-4 bg-red-50 border border-red-400 text-red-700 rounded-xl px-4 py-3 flex items-start gap-2">
                <span className="font-bold">✗</span>
                <span>{error}</span>
              </div>
            )}
            {successMsg && (
              <div className="mb-4 bg-green-50 border border-green-400 text-green-700 rounded-xl px-4 py-3 flex items-start gap-2">
                <span className="font-bold">✓</span>
                <span>{successMsg}</span>
              </div>
            )}

            <form className="space-y-6" onSubmit={handleSubmit}>
              <div className="grid md:grid-cols-2 gap-4">
                <div>
                  <label className="block font-medium mb-1">Team Name</label>
                  <input
                    className="w-full border rounded-xl p-3"
                    placeholder="Enter Team Name"
                    value={teamName}
                    onChange={(e) => { setTeamName(e.target.value); setError(''); setSuccessMsg(''); }}
                    required
                  />
                </div>
                <div>
                  <label className="block font-medium mb-1">Team Captain</label>
                  <input
                    className="w-full border rounded-xl p-3"
                    placeholder="Captain Name"
                    value={captain}
                    onChange={(e) => setCaptain(e.target.value)}
                    required
                  />
                </div>
              </div>

              <div>
                <h2 className="text-xl font-semibold text-green-700 mb-1">Player Details</h2>
                <p className="text-sm text-gray-500 mb-3">Must be exactly 5 Male and 1 Female.</p>
                <div className="space-y-3">
                  {players.map((player, i) => (
                    <div key={i} className="border rounded-2xl p-4 grid md:grid-cols-3 gap-3 bg-gray-50">
                      <div className="flex items-center gap-2">
                        <span className="text-gray-400 text-sm font-medium w-6">{i + 1}.</span>
                        <input
                          className="border rounded-lg p-2 flex-1"
                          placeholder={`Player ${i + 1} Name`}
                          value={player.name}
                          onChange={(e) => updatePlayer(i, 'name', e.target.value)}
                          required
                        />
                      </div>
                      <select
                        className={`border rounded-lg p-2 ${player.gender === '' ? 'text-gray-400' : 'text-gray-800'}`}
                        value={player.gender}
                        onChange={(e) => updatePlayer(i, 'gender', e.target.value)}
                        required
                      >
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                      </select>
                      {player.gender && (
                        <span className={`flex items-center text-sm font-medium ${player.gender === 'Female' ? 'text-pink-600' : 'text-blue-600'}`}>
                          {player.gender === 'Female' ? '♀ Female' : '♂ Male'}
                        </span>
                      )}
                    </div>
                  ))}
                </div>
                {/* Live composition counter */}
                <div className="mt-3 flex gap-4 text-sm">
                  <span className="text-blue-600 font-medium">
                    ♂ Male: {players.filter(p => p.gender === 'Male').length} / 5
                  </span>
                  <span className="text-pink-600 font-medium">
                    ♀ Female: {players.filter(p => p.gender === 'Female').length} / 1
                  </span>
                </div>
              </div>

              <div className="bg-yellow-50 border border-yellow-300 rounded-xl p-4 text-sm">
                Team Rules:
                <ul className="list-disc ml-5 mt-2">
                  <li>Maximum 6 players per team.</li>
                  <li>Team composition must be exactly 5 men and 1 girl.</li>
                  <li>All player details must be submitted before the registration deadline.</li>
                </ul>
              </div>

              <button
                type="submit"
                disabled={loading}
                className="bg-green-600 hover:bg-green-700 disabled:bg-green-300 text-white px-6 py-3 rounded-xl font-semibold transition-colors"
              >
                {loading ? 'Registering...' : 'Register Team'}
              </button>
            </form>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CricketRegistrationForm />);
  </script>
</body>
</html>
