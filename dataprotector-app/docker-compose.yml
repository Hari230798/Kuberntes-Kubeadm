# Local testing of the three-tier app (no Kubernetes required).
#   docker compose up --build
#   Frontend: http://localhost:8080   Admin: http://localhost:8080/admin.html
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: RootPass123
      MYSQL_DATABASE: dataprotector
      MYSQL_USER: appuser
      MYSQL_PASSWORD: AppPass123
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: dataprotector
      DB_USER: appuser
      DB_PASSWORD: AppPass123
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: Admin@123
      ADMIN_TOKEN: super-secret-admin-token
    depends_on:
      - mysql

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data:
